<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Review Sentiment Analysis</title>
</head>
<body>
<h1>Amazon Review Sentiment Analysis</h1>
<form id="sentimentForm">
  <textarea id="reviewInput" placeholder="Enter your review here..." rows="5" cols="50"></textarea><br><br>
  <button type="button" onclick="predictSentiment()">Predict</button>
</form>
<h2>Results:</h2>
<div id="results"></div>
<script>
  async function predictSentiment() {
    const reviewInput = document.getElementById('reviewInput').value;
    const response = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ review: reviewInput })
    });
    const result = await response.json();
    document.getElementById('results').innerText = JSON.stringify(result, null, 2);
  }
</script>
</body>
</html>
