<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Review Sentiment Analysis</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      color: #343a40;
      margin-bottom: 20px;
    }
    #sentimentForm {
      max-width: 600px;
      margin: auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    #reviewInput {
      resize: none;
    }
    #results {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: #e9ecef;
    }
  </style>
</head>
<body>
<div class="container">
  <h1 class="text-center">Amazon Review Sentiment Analysis</h1>
  <form id="sentimentForm" class="shadow p-4">
    <div class="mb-3">
      <textarea id="reviewInput" class="form-control" placeholder="Enter your review here..." rows="5"></textarea>
    </div>
    <div class="text-center">
      <button type="button" class="btn btn-primary" onclick="predictSentiment()">Predict Sentiment</button>
    </div>
  </form>
  <h2 class="text-center mt-4">Results:</h2>
  <div id="results" class="border border-secondary"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  async function predictSentiment() {
    const reviewInput = document.getElementById('reviewInput').value;
    const response = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ review: reviewInput })
    });
    const result = await response.json();
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
  }
</script>
</body>
</html>
